services:
  - type: web
    name: my-little-phone-v2-api
    runtime: docker
    dockerfilePath: ./v2/backend/Dockerfile
    dockerContext: ./v2/backend
    healthCheckPath: /health
    autoDeploy: true
    plan: free
    envVars:
      - key: MLP_ALLOWED_ORIGINS
        value: https://miroin.github.io
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: MINIMAX_API_KEY
        sync: false
      - key: MINIMAX_VOICE_ID
        sync: false
      - key: SCHEDULER_TOKEN
        generateValue: true
      - key: MLP_ACCESS_TOKEN
        generateValue: true
      - key: MLP_BACKUP_MAX_MB
        value: 512
      - key: MLP_DATABASE_PATH
        value: /data/little-phone.db
      - key: MLP_AUDIO_PATH
        value: /data/audio
      - key: MLP_MEDIA_PATH
        value: /data/media
      - key: MLP_VAPID_PATH
        value: /data/vapid.json
      - key: VAPID_SUBJECT
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MLP_SNAPSHOT_BUCKET
        value: mlp-backups
