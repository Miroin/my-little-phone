name: 小手叽 v2 自动验收

on:
  push:
    branches: [main, next-development]
    paths:
      - "v2/**"
      - "render.yaml"
      - ".github/workflows/v2-verify.yml"
  pull_request:
    paths:
      - "v2/**"
      - "render.yaml"
      - ".github/workflows/v2-verify.yml"
  workflow_dispatch:

concurrency:
  group: v2-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: 运行全部后端回归测试
        run: |
          set -euo pipefail
          for test_file in test_*.py; do
            python "$test_file"
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: v2/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 验证后端生产镜像
        run: docker build -f v2/backend/Dockerfile v2/backend
